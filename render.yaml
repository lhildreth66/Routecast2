# Render Blueprint - Deploy both services with one click
# Usage: Connect this repo to Render and it will auto-detect this file

services:
  # Backend API Service
  - type: web
    name: routecast-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false  # Set manually in Render dashboard
      - key: DB_NAME
        value: routecast_db
      - key: MAPBOX_ACCESS_TOKEN
        sync: false  # Set manually in Render dashboard
      - key: GOOGLE_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /api/health
    autoDeploy: true

  # Frontend Static Site (Web export)
  # Note: For mobile app, use EAS Build instead
  - type: web
    name: routecast-frontend
    runtime: node
    rootDir: frontend
    buildCommand: yarn install && npx expo export --platform web && cp public/push-sw.js dist/push-sw.js
    startCommand: npx serve dist -l $PORT
    envVars:
      - key: EXPO_PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: routecast-backend
          property: host
      - key: NODE_VERSION
        value: 18.19.0
    autoDeploy: true

  # Signup reminder emails – runs every hour
  - type: cron
    name: routecast-signup-reminders
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    schedule: "0 * * * *"
    command: python run_signup_reminders.py
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: routecast_db
      - key: BACKEND_PUBLIC_URL
        value: https://api.routecastweather.com
      - key: SENDGRID_API_KEY
        sync: false
      - key: SEND_FROM_EMAIL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
