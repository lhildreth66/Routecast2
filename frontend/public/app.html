<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RouteCast Weather</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #fff;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 16px;
      padding: 40px 28px;
      text-align: center;
    }
    .icon { font-size: 52px; margin-bottom: 16px; }
    h1 {
      margin: 0 0 12px;
      font-size: 26px;
      font-weight: 700;
      color: #eab308;
    }
    p {
      margin: 0 0 8px;
      font-size: 16px;
      line-height: 1.6;
      color: #d1d5db;
    }
    .sub {
      font-size: 14px;
      color: #9ca3af;
      margin-bottom: 32px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#9928;</div>
    <h1>RouteCast Weather</h1>
    <p>Open the RouteCast Weather app on your device and log in.</p>
    <p class="sub">Available for iPhone and Android.</p>
  </div>
</body>
</html>
